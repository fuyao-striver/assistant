[package]
name = "app"
version = "0.1.0"
description = "一个基于tauri的英雄联盟助手，学习开源软件"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.97.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-log = "2"
sysinfo = "0.39.6"
thiserror = "2.0.18"
base64 = "0.22.1"
tauri-plugin-process = "2.3.1"
